services:

  redis:
    image: redis:7-alpine
    container_name: redis-server

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: always

  authservice:
    build:
      context: .
      dockerfile: apps/authservice/Dockerfile

    container_name: authservice

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy

    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379

    restart: always
