get:
  tags:
    - Users
  summary: Get current authenticated user
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Current user details
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../schemas/SuccessEnvelope.yaml"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "../schemas/User.yaml"
                    required:
                      - user
    "401":
      $ref: "../components/responses.yaml#/ErrorResponse"
    "404":
      $ref: "../components/responses.yaml#/ErrorResponse"

