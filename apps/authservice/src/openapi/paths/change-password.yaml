post:
  tags:
    - Auth
  summary: Change password for authenticated user
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/ChangePasswordRequest.yaml"
  responses:
    "200":
      description: Password changed
      content:
        application/json:
          schema:
            $ref: "../schemas/SuccessEnvelope.yaml"
    "401":
      $ref: "../components/responses.yaml#/ErrorResponse"

