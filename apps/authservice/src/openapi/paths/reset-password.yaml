post:
  tags:
    - Auth
  summary: Reset password using reset code
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/ResetPasswordRequest.yaml"
  responses:
    "200":
      description: Password reset complete
      content:
        application/json:
          schema:
            $ref: "../schemas/SuccessEnvelope.yaml"
    "400":
      $ref: "../components/responses.yaml#/ErrorResponse"

